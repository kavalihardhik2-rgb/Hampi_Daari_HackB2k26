<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2622">
<title>Hampi Daari</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <div class="brand-name">Hampi Daari</div>
      <div class="brand-sub" data-t="tagline"></div>
    </div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button>
    <button data-lang="kn">ಕನ್ನಡ</button>
    <button data-lang="hi">हिंदी</button>
    <button data-lang="te">తెలుగు</button>
  </div>
  <button id="textToggle" class="text-toggle" aria-label="Toggle text size">A+</button>
</header>

<div class="layout">
  <section id="mapPane" class="pane map-pane">
    <div id="map"></div>
    <div class="map-tools">
      <button id="locBtn" class="chip" data-t="setLoc"></button>
      <button id="gpsBtn" class="chip" data-t="useGps"></button>
    </div>
    <div id="nearBox" class="near" hidden></div>
  </section>

  <section class="side">
    <nav class="tabs" role="tablist">
      <button data-tab="map" class="only-mobile" data-t="tabMap"></button>
      <button data-tab="places" data-t="tabPlaces"></button>
      <button data-tab="guide" data-t="tabGuide"></button>
      <button data-tab="plan" data-t="tabPlan"></button>
      <button data-tab="signs" data-t="tabSigns"></button>
    </nav>

    <div id="places" class="pane">
      <div class="progress">
        <div class="progress-text"><span id="seenCount"></span></div>
        <div class="bar"><i id="seenBar"></i></div>
      </div>
      <ul id="siteList" class="site-list"></ul>
    </div>

    <div id="guide" class="pane">
      <div class="seg">
        <button data-mode="check" data-t="modeCheck"></button>
        <button data-mode="ask" data-t="modeAsk"></button>
      </div>
      <p class="hint" id="guideHint"></p>
      <form id="guideForm" class="ask">
        <input id="guideInput" autocomplete="off" maxlength="300">
        <button class="btn" data-t="go"></button>
      </form>
      <div id="samples" class="samples"></div>
      <div id="guideOut"></div>
      <p class="muted small" data-t="englishOnly"></p>
    </div>

    <div id="plan" class="pane">
      <form id="planForm" class="plan-form">
        <label><span data-t="startFrom"></span>
          <select id="planStart"></select>
        </label>
        <label><span data-t="timeAvail"></span>
          <select id="planTime">
            <optgroup label="Hours" id="grpHours" data-label-t="grpHours">
              <option value="120" data-t-val="h2">2 h</option>
              <option value="240" data-t-val="h4" selected>4 h</option>
              <option value="360" data-t-val="h6">6 h</option>
              <option value="480" data-t-val="h8">8 h</option>
            </optgroup>
            <optgroup label="Days / Multi-Day" id="grpDays" data-label-t="grpDays">
              <option value="600" data-t-val="d1">1 Day (Full day)</option>
              <option value="1200" data-t-val="d2">2 Days</option>
              <option value="1800" data-t-val="d3">3 Days</option>
              <option value="4200" data-t-val="w1">1 Week (Complete tour)</option>
            </optgroup>
          </select>
        </label>
        <div class="seg" id="planMode">
          <button type="button" data-mode="walk" data-t="walk"></button>
          <button type="button" data-mode="cycle" data-t="cycle"></button>
          <button type="button" data-mode="auto" data-t="auto"></button>
          <button type="button" data-mode="bike" data-t="bike"></button>
          <button type="button" data-mode="car" data-t="car"></button>
        </div>
        <button class="btn wide" data-t="planBtn"></button>
      </form>
      <div id="planOut"></div>
    </div>

    <div id="signs" class="pane">
      <h3 data-t="signsTitle"></h3>
      <p data-t="signsText"></p>
      <a class="btn" href="/signs" data-t="signsBtn"></a>
      <div id="signLinks" class="sign-links"></div>
    </div>
  </section>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Monument details">
    <button id="sheetClose" class="close" aria-label="Close">&times;</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
