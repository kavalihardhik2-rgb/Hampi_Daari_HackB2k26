<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b2622">
  <title>Sign in · Hampi Daari</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body.login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5efe2; }
    .login-card { width: min(100%, 420px); background: #fffaf1; border: 1px solid #e5d4b9; border-radius: 20px; padding: 34px; box-shadow: 0 18px 55px #3b2c1b1c; }
    .login-brand { color: #a65312; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .login-card h1 { margin: 14px 0 8px; color: #2b2622; font-size: 30px; }
    .login-card p { color: #766858; line-height: 1.55; }
    .login-card label { display: block; margin: 18px 0 7px; font-weight: 600; }
    .login-card input { box-sizing: border-box; width: 100%; padding: 12px 13px; border: 1px solid #dfd0ba; border-radius: 10px; font: inherit; background: white; }
    .login-card button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 10px; background: #a65312; color: white; font: inherit; font-weight: 700; }
    .login-note { margin-top: 18px; padding: 11px; border-radius: 9px; background: #f2eadb; font-size: 13px; }
    .login-back { display: inline-block; margin-top: 20px; color: #805027; }
  </style>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">Hampi Daari</div>
    <h1>Welcome back</h1>
    <p>Sign in to continue your Hampi visit.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
      <button type="submit">Sign in</button>
    </form>
    <div class="login-note" role="status">Sign-in is a preview screen. Account authentication is not configured yet.</div>
    <a class="login-back" href="/">← Back to Hampi Daari</a>
  </main>
  <script>document.getElementById('loginForm').addEventListener('submit', function (event) { event.preventDefault(); });</script>
</body>
</html>
